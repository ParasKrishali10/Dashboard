name: Hazard Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: main          # ← forces latest main branch

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests numpy pandas joblib twilio scikit-learn==1.5.1 xgboost

    - name: Print file to verify
      run: |
        head -20 auto_alert.py    # ← prints first 20 lines so we can see what's running

    - name: Run hazard monitor
      env:
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
        ALERT_TO_NUMBER:    ${{ secrets.ALERT_TO_NUMBER }}
        GEOAPIFY_API_KEY:   ${{ secrets.GEOAPIFY_API_KEY }}
      run: python auto_alert.py